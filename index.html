<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FAF8F3; --surface: #FFFFFF; --border: rgba(0,0,0,0.1);
  --border-strong: rgba(0,0,0,0.18); --text: #1A1714; --muted: #7A746C;
  --accent: #2E1A0E; --amber: #C17E2A; --amber-light: #FDF3E3;
  --amber-dark: #7A4F0F; --red: #B94040; --red-light: #FDF0EF;
  --radius: 12px; --radius-sm: 8px;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 3rem; }

.site-header { background: var(--accent); color: #FAF8F3; padding: 1.75rem 1.25rem 1.25rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
.site-header h1 { font-family: 'DM Serif Display', serif; font-size: 30px; font-weight: 400; }
.site-header p { font-size: 11px; opacity: 0.5; margin-top: 3px; }
.hdr-btns { display: flex; gap: 8px; flex-shrink: 0; }
.btn-amber { background: var(--amber); color: #fff; border: none; border-radius: var(--radius-sm); padding: 8px 15px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
.btn-amber:hover { background: var(--amber-dark); }
.btn-outline-light { background: rgba(255,255,255,0.12); color: #FAF8F3; border: 0.5px solid rgba(255,255,255,0.3); border-radius: var(--radius-sm); padding: 8px 15px; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
.btn-outline-light:hover { background: rgba(255,255,255,0.22); }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 1.1rem 1.25rem 0; }
.stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.75rem 1rem; text-align: center; }
.stat-num { font-size: 22px; font-weight: 500; font-family: 'DM Serif Display', serif; }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }

.controls { padding: 0.875rem 1.25rem 0.4rem; }
.search-wrap { position: relative; }
.search-wrap input { width: 100%; padding: 9px 12px 9px 32px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; background: var(--surface); color: var(--text); outline: none; }
.search-wrap input:focus { border-color: var(--amber); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }

.tabs-outer { overflow-x: auto; scrollbar-width: none; border-bottom: 0.5px solid var(--border); margin-top: 0.5rem; }
.tabs-outer::-webkit-scrollbar { display: none; }
.tabs-inner { display: flex; padding: 0 1.25rem; width: max-content; }
.tab { flex-shrink: 0; font-size: 13px; padding: 9px 13px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -0.5px; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; transition: color 0.15s; }
.tab.active { color: var(--text); font-weight: 500; border-bottom-color: var(--accent); }
.tab:hover:not(.active) { color: var(--text); }
.tab-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 100px; margin-left: 4px; font-weight: 400; }

.inventory { padding: 0 1.25rem; }
.sec-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 0.75rem 0 0.4rem; }

.item { display: flex; align-items: center; gap: 11px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.15s; }
.item:hover { border-color: var(--border-strong); }
.lbl-icon { flex-shrink: 0; width: 30px; height: 42px; }
.lbl-icon img { width: 30px; height: 42px; object-fit: cover; border-radius: 4px; border: 0.5px solid var(--border); }
.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 14px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.item-sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.badge-out { font-size: 10px; padding: 2px 6px; border-radius: 100px; background: var(--red-light); color: var(--red); font-weight: 500; }
.fill-pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 2px 7px 2px 4px; border-radius: 100px; font-weight: 500; border: none; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
.fill-pill:hover { opacity: 0.75; }
.fdots { display: inline-flex; gap: 2px; align-items: center; }
.fdot { width: 5px; height: 5px; border-radius: 50%; }
.qty-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.qty-btn { width: 27px; height: 27px; border-radius: 50%; border: 0.5px solid var(--border-strong); background: var(--bg); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; color: var(--text); transition: background 0.1s; font-family: inherit; }
.qty-btn:hover { background: var(--amber-light); border-color: var(--amber); }
.qty-num { font-size: 14px; font-weight: 500; min-width: 18px; text-align: center; }
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-size: 14px; }

.cocktail-wrap { padding: 0.25rem 1.25rem 0; }
.cocktail-btn { width: 100%; background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 12px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, border-color 0.15s; }
.cocktail-btn:hover { background: var(--amber-light); border-color: var(--amber); }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(20,14,8,0.52); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; padding: 1.4rem; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; }
.modal-handle { width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 1.25rem; }
.modal h2 { font-family: 'DM Serif Display', serif; font-size: 21px; font-weight: 400; margin-bottom: 1.1rem; }
.field { margin-bottom: 0.8rem; }
.field label { display: block; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; background: var(--bg); color: var(--text); outline: none; appearance: none; }
.field input:focus, .field select:focus { border-color: var(--amber); background: #fff; }

.fill-picker { display: flex; gap: 5px; flex-wrap: wrap; }
.fill-opt { flex: 1; min-width: 58px; padding: 7px 4px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); cursor: pointer; background: var(--surface); font-family: inherit; font-size: 11px; text-align: center; color: var(--text); transition: all 0.15s; }
.fill-opt.selected { border-color: var(--accent); background: var(--amber-light); font-weight: 500; color: var(--accent); }
.fill-opt-dots { display: flex; justify-content: center; gap: 2px; margin-bottom: 3px; }
.fill-opt-dots span { width: 5px; height: 5px; border-radius: 50%; }

.photo-area { border: 1.5px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 0.875rem; text-align: center; cursor: pointer; background: var(--bg); transition: border-color 0.15s; margin-bottom: 6px; }
.photo-area:hover { border-color: var(--amber); }
.photo-area p { font-size: 13px; color: var(--muted); margin-top: 6px; }
.photo-area img { width: 100%; max-height: 160px; object-fit: contain; border-radius: 6px; }
.photo-btns { display: flex; gap: 6px; margin-bottom: 0.5rem; }
.photo-btns button { flex: 1; padding: 7px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; background: var(--surface); color: var(--text); font-family: inherit; transition: background 0.15s; }
.photo-btns button:hover { background: var(--bg); }

.modal-actions { display: flex; gap: 8px; margin-top: 1.25rem; }
.btn-cancel { flex: 1; padding: 11px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); background: transparent; font-family: inherit; font-size: 14px; cursor: pointer; color: var(--muted); }
.btn-save { flex: 2; padding: 11px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: #FAF8F3; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
.btn-save:hover { background: #3D2416; }
.btn-danger { flex: 1; padding: 11px; border: 0.5px solid var(--red); border-radius: var(--radius-sm); background: transparent; font-family: inherit; font-size: 14px; cursor: pointer; color: var(--red); }

.detail-photo { width: 100%; max-height: 220px; object-fit: contain; border-radius: var(--radius-sm); margin-bottom: 1rem; border: 0.5px solid var(--border); }
.detail-placeholder { width: 100%; height: 110px; border-radius: var(--radius-sm); margin-bottom: 1rem; border: 0.5px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
.detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid rgba(0,0,0,0.07); }
.detail-row:last-child { border-bottom: none; }
.detail-row .dl { font-size: 12px; color: var(--muted); }
.detail-row .dv { font-size: 13px; font-weight: 500; color: var(--text); text-align: right; display: flex; align-items: center; gap: 5px; }

.loc-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 0.5rem; }
.loc-chip { font-size: 12px; padding: 4px 10px; border-radius: 100px; border: 0.5px solid; display: inline-flex; align-items: center; gap: 4px; }
.loc-chip-x { cursor: pointer; font-size: 14px; line-height: 1; margin-left: 2px; }
.loc-chip-x:hover { opacity: 0.6; }

.cocktail-result { font-size: 14px; color: var(--text); line-height: 1.75; white-space: pre-wrap; min-height: 80px; }
.dot-pulse { display: flex; gap: 4px; align-items: center; }
.dot-pulse span { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
.dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
.dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
</style>
</head>
<body>

<header class="site-header">
  <div>
    <h1>Home Bar</h1>
    <p id="last-updated">Tap a bottle to view details</p>
  </div>
  <div class="hdr-btns">
    <button class="btn-outline-light" onclick="openManageLocations()">+ Location</button>
    <button class="btn-amber" onclick="openAdd()">+ Bottle</button>
  </div>
</header>

<div class="stats-row" id="stats"></div>
<div class="controls"><div class="search-wrap"><span class="search-icon">⌕</span><input type="text" id="search" placeholder="Search all locations…" oninput="render()"></div></div>
<div class="tabs-outer"><div class="tabs-inner" id="tabs"></div></div>
<div class="inventory" id="inventory"></div>
<div class="cocktail-wrap"><button class="cocktail-btn" onclick="openCocktails()">✦ What can I make tonight?</button></div>

<!-- Detail modal -->
<div class="modal-bg" id="detail-modal" onclick="bgClick(event,'detail-modal')">
  <div class="modal"><div class="modal-handle"></div><div id="detail-body"></div></div>
</div>

<!-- Edit modal -->
<div class="modal-bg" id="edit-modal" onclick="bgClick(event,'edit-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Edit bottle</h2>
    <div class="field"><label>Name</label><input type="text" id="e-name"></div>
    <div class="field"><label>Location</label><select id="e-loc"></select></div>
    <div class="field"><label>Category</label>
      <select id="e-cat">
        <option>Whiskey</option><option>Bourbon</option><option>Scotch</option><option>Gin</option><option>Vodka</option><option>Rum</option><option>Tequila</option><option>Mezcal</option><option>Brandy</option><option>Liqueur</option><option>Wine</option><option>Beer</option><option>Vermouth</option><option>Bitters</option><option>Mixer</option><option>Other</option>
      </select>
    </div>
    <div class="field"><label>Quantity</label><input type="number" id="e-qty" min="0" max="99"></div>
    <div class="field"><label>Fill level</label>
      <div class="fill-picker" id="e-fill-picker">
        <button class="fill-opt" data-fill="full" onclick="pickFill(this,'e-fill-picker')"><div class="fill-opt-dots"><span style="background:#2E8B57"></span><span style="background:#2E8B57"></span><span style="background:#2E8B57"></span><span style="background:#2E8B57"></span></div>Full</button>
        <button class="fill-opt" data-fill="3/4" onclick="pickFill(this,'e-fill-picker')"><div class="fill-opt-dots"><span style="background:#5B8AC4"></span><span style="background:#5B8AC4"></span><span style="background:#5B8AC4"></span><span style="background:rgba(0,0,0,0.12)"></span></div>¾</button>
        <button class="fill-opt" data-fill="1/2" onclick="pickFill(this,'e-fill-picker')"><div class="fill-opt-dots"><span style="background:#C17E2A"></span><span style="background:#C17E2A"></span><span style="background:rgba(0,0,0,0.12)"></span><span style="background:rgba(0,0,0,0.12)"></span></div>Half</button>
        <button class="fill-opt" data-fill="low" onclick="pickFill(this,'e-fill-picker')"><div class="fill-opt-dots"><span style="background:#B94040"></span><span style="background:rgba(0,0,0,0.12)"></span><span style="background:rgba(0,0,0,0.12)"></span><span style="background:rgba(0,0,0,0.12)"></span></div>Almost empty</button>
      </div>
    </div>
    <div class="field">
      <label>Label photo</label>
      <div class="photo-area" id="e-photo-area" onclick="ePhotoTap()">
        <div id="e-photo-preview"></div>
        <p id="e-photo-hint">Tap to add a photo</p>
      </div>
      <div class="photo-btns">
        <button onclick="ePhotoCamera()">📷 Camera</button>
        <button onclick="ePhotoFile()">📁 Upload</button>
        <button onclick="eClearPhoto()" style="color:var(--red)">Remove</button>
      </div>
      <input type="file" id="e-file-input" accept="image/*" style="display:none" onchange="eHandleFile(event)">
      <input type="file" id="e-camera-input" accept="image/*" capture="environment" style="display:none" onchange="eHandleFile(event)">
    </div>
    <div class="field"><label>Notes</label><input type="text" id="e-notes" placeholder="e.g. 750ml, gift…"></div>
    <div class="modal-actions">
      <button class="btn-danger" onclick="deleteBottle()">Delete</button>
      <button class="btn-cancel" onclick="closeModal('edit-modal')">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Add modal -->
<div class="modal-bg" id="add-modal" onclick="bgClick(event,'add-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Add a bottle</h2>
    <div class="field"><label>Bottle name</label><input type="text" id="a-name" placeholder="e.g. Bulleit Rye"></div>
    <div class="field"><label>Location</label><select id="a-loc"></select></div>
    <div class="field"><label>Category</label>
      <select id="a-cat">
        <option>Whiskey</option><option>Bourbon</option><option>Scotch</option><option>Gin</option><option>Vodka</option><option>Rum</option><option>Tequila</option><option>Mezcal</option><option>Brandy</option><option>Liqueur</option><option>Wine</option><option>Beer</option><option>Vermouth</option><option>Bitters</option><option>Mixer</option><option>Other</option>
      </select>
    </div>
    <div class="field"><label>Quantity</label><input type="number" id="a-qty" value="1" min="0" max="99"></div>
    <div class="field"><label>Fill level</label>
      <div class="fill-picker" id="a-fill-picker">
        <button class="fill-opt selected" data-fill="full" onclick="pickFill(this,'a-fill-picker')"><div class="fill-opt-dots"><span style="background:#2E8B57"></span><span style="background:#2E8B57"></span><span style="background:#2E8B57"></span><span style="background:#2E8B57"></span></div>Full</button>
        <button class="fill-opt" data-fill="3/4" onclick="pickFill(this,'a-fill-picker')"><div class="fill-opt-dots"><span style="background:#5B8AC4"></span><span style="background:#5B8AC4"></span><span style="background:#5B8AC4"></span><span style="background:rgba(0,0,0,0.12)"></span></div>¾</button>
        <button class="fill-opt" data-fill="1/2" onclick="pickFill(this,'a-fill-picker')"><div class="fill-opt-dots"><span style="background:#C17E2A"></span><span style="background:#C17E2A"></span><span style="background:rgba(0,0,0,0.12)"></span><span style="background:rgba(0,0,0,0.12)"></span></div>Half</button>
        <button class="fill-opt" data-fill="low" onclick="pickFill(this,'a-fill-picker')"><div class="fill-opt-dots"><span style="background:#B94040"></span><span style="background:rgba(0,0,0,0.12)"></span><span style="background:rgba(0,0,0,0.12)"></span><span style="background:rgba(0,0,0,0.12)"></span></div>Almost empty</button>
      </div>
    </div>
    <div class="field">
      <label>Label photo (optional)</label>
      <div class="photo-area" id="a-photo-area" onclick="aPhotoTap()">
        <div id="a-photo-preview"></div>
        <p id="a-photo-hint">Tap to add a photo</p>
      </div>
      <div class="photo-btns">
        <button onclick="aPhotoCamera()">📷 Camera</button>
        <button onclick="aPhotoFile()">📁 Upload</button>
        <button onclick="aClearPhoto()" style="color:var(--red)">Remove</button>
      </div>
      <input type="file" id="a-file-input" accept="image/*" style="display:none" onchange="aHandleFile(event)">
      <input type="file" id="a-camera-input" accept="image/*" capture="environment" style="display:none" onchange="aHandleFile(event)">
    </div>
    <div class="field"><label>Notes (optional)</label><input type="text" id="a-notes" placeholder="e.g. 750ml, gift…"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('add-modal')">Cancel</button>
      <button class="btn-save" onclick="addBottle()">Add bottle</button>
    </div>
  </div>
</div>

<!-- Manage locations modal -->
<div class="modal-bg" id="locs-modal" onclick="bgClick(event,'locs-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Manage locations</h2>
    <div class="field">
      <label>Add new location</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="new-loc-input" placeholder="e.g. Patio Bar" style="flex:1">
        <button class="btn-save" style="flex:0;padding:9px 16px;flex-shrink:0" onclick="addLocation()">Add</button>
      </div>
    </div>
    <div class="field">
      <label>All locations</label>
      <div class="loc-chips" id="loc-chips"></div>
      <p style="font-size:11px;color:var(--muted);margin-top:8px">Built-in locations can't be deleted. Custom locations can only be deleted when empty.</p>
    </div>
    <div class="modal-actions"><button class="btn-save" style="flex:1" onclick="closeModal('locs-modal')">Done</button></div>
  </div>
</div>

<!-- Fill-only modal -->
<div class="modal-bg" id="fill-modal" onclick="bgClick(event,'fill-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="fill-modal-title">Update fill level</h2>
    <div class="fill-picker" id="fill-picker-main">
      <button class="fill-opt" data-fill="full" onclick="pickFill(this,'fill-picker-main')"><div class="fill-opt-dots"><span style="background:#2E8B57"></span><span style="background:#2E8B57"></span><span style="background:#2E8B57"></span><span style="background:#2E8B57"></span></div>Full</button>
      <button class="fill-opt" data-fill="3/4" onclick="pickFill(this,'fill-picker-main')"><div class="fill-opt-dots"><span style="background:#5B8AC4"></span><span style="background:#5B8AC4"></span><span style="background:#5B8AC4"></span><span style="background:rgba(0,0,0,0.12)"></span></div>¾</button>
      <button class="fill-opt" data-fill="1/2" onclick="pickFill(this,'fill-picker-main')"><div class="fill-opt-dots"><span style="background:#C17E2A"></span><span style="background:#C17E2A"></span><span style="background:rgba(0,0,0,0.12)"></span><span style="background:rgba(0,0,0,0.12)"></span></div>Half</button>
      <button class="fill-opt" data-fill="low" onclick="pickFill(this,'fill-picker-main')"><div class="fill-opt-dots"><span style="background:#B94040"></span><span style="background:rgba(0,0,0,0.12)"></span><span style="background:rgba(0,0,0,0.12)"></span><span style="background:rgba(0,0,0,0.12)"></span></div>Almost empty</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('fill-modal')">Cancel</button>
      <button class="btn-save" onclick="saveFillOnly()">Save</button>
    </div>
  </div>
</div>

<!-- Cocktail modal -->
<div class="modal-bg" id="cocktail-modal" onclick="bgClick(event,'cocktail-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Tonight's options</h2>
    <div class="cocktail-result" id="cocktail-result"></div>
    <div class="modal-actions"><button class="btn-save" style="flex:1" onclick="closeModal('cocktail-modal')">Done</button></div>
  </div>
</div>

<script>
const BUILTIN_LOCS = ['Air Maroc', 'Atlas Air', 'Ice Cart', 'Downstairs Bar', 'Garage'];
const LOC_COLORS_DEFAULT = { 'Air Maroc': '#7F77DD', 'Atlas Air': '#1D9E75', 'Ice Cart': '#378ADD', 'Downstairs Bar': '#C17E2A', 'Garage': '#7A746C' };

function locColor(loc) { return LOC_COLORS_DEFAULT[loc] || PALETTE[store.locations.indexOf(loc) % PALETTE.length] || '#7A746C'; }

function fillPillHtml(fill, id) {
  const f = FILLS[fill] || FILLS['full'];
  const dots = Array.from({length:4}, (_,i) => `<span class="fdot" style="background:${i<f.dots?f.color:'rgba(0,0,0,0.12)'}"></span>`).join('');
  return `<button class="fill-pill" style="background:${f.bg};color:${f.color}" onclick="event.stopPropagation();openFillOnly(${id})"><span class="fdots">${dots}</span>${f.label}</button>`;
}

function save() {
  try { localStorage.setItem('hb_v5', JSON.stringify(store)); } catch(e) {}
  document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleDateString('en-US', {month:'short',day:'numeric'});
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const inv = store.inventory;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${inv.length}</div><div class="stat-label">Bottles</div></div>
    <div class="stat-card"><div class="stat-num">${inv.filter(i=>i.qty>0).length}</div><div class="stat-label">In stock</div></div>
    <div class="stat-card"><div class="stat-num">${inv.filter(i=>i.qty===0).length}</div><div class="stat-label">Out</div></div>`;

  const tabs = ['All', ...store.locations];
  document.getElementById('tabs').innerHTML = tabs.map(t => {
    const count = t === 'All' ? inv.length : inv.filter(i => i.loc === t).length;
    const col = t === 'All' ? '' : locColor(t);
    return `<button class="tab ${activeTab===t?'active':''}" onclick="setTab('${t}')">
      ${t}<span class="tab-badge" style="background:${col?col+'18':'rgba(0,0,0,0.07)'};color:${col||'#7A746C'}">${count}</span>
    </button>`;
  }).join('');

  let items = inv.filter(i => {
    if (activeTab !== 'All' && i.loc !== activeTab) return false;
    if (q && !i.name.toLowerCase().includes(q) && !i.cat.toLowerCase().includes(q) && !i.loc.toLowerCase().includes(q)) return false;
    return true;
  });

  if (!items.length) { document.getElementById('inventory').innerHTML = '<div class="empty">No bottles found</div>'; return; }

  let html = '';
  if (activeTab === 'All') {
    store.locations.forEach(loc => {
      const li = items.filter(i => i.loc === loc);
      if (!li.length) return;
      const col = locColor(loc);
      html += `<div class="sec-label" style="color:${col};border-left:3px solid ${col};padding-left:8px;border-radius:0">${loc}</div>`;
      li.forEach(item => html += itemHtml(item, false));
    });
  } else {
    const cats = [...new Set(items.map(i => i.cat))];
    cats.forEach(cat => {
      html += `<div class="sec-label">${cat}</div>`;
      items.filter(i => i.cat === cat).forEach(item => html += itemHtml(item, true));
    });
  }
  document.getElementById('inventory').innerHTML = html;
}

function itemHtml(item, showLoc) {
  const thumb = item.photo
    ? `<img src="${item.photo}" style="width:30px;height:42px;object-fit:cover;border-radius:4px;border:0.5px solid rgba(0,0,0,0.1)">`
    : getLabel(item.cat, item.id);
  return `<div class="item" onclick="openDetail(${item.id})">
    <div class="lbl-icon">${thumb}</div>
    <div class="item-info">
      <div class="item-name">${item.name}${item.qty===0?'<span class="badge-out">out</span>':''}</div>
      <div class="item-sub">
        ${showLoc ? `<span style="color:${locColor(item.loc)};font-weight:500">${item.loc}</span><span>·</span>` : ''}
        <span>${item.cat}</span>
        ${item.qty > 0 ? `<span>·</span>${fillPillHtml(item.fill, item.id)}` : ''}
      </div>
    </div>
    <div class="qty-ctrl" onclick="event.stopPropagation()">
      <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
      <span class="qty-num">${item.qty}</span>
      <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
    </div>
  </div>`;
}

function setTab(t) { activeTab = t; render(); }
function changeQty(id, d) {
  const i = store.inventory.find(x => x.id === id);
  if (i) { i.qty = Math.max(0, i.qty + d); save(); render(); }
}

function openDetail(id) {
  const item = store.inventory.find(x => x.id === id);
  if (!item) return;
  const f = FILLS[item.fill] || FILLS['full'];
  const dots = Array.from({length:4}, (_,i) => `<span class="fdot" style="width:7px;height:7px;border-radius:50%;background:${i<f.dots?f.color:'rgba(0,0,0,0.12)'}"></span>`).join('');
  document.getElementById('detail-body').innerHTML = `
    ${item.photo ? `<img src="${item.photo}" class="detail-photo">` : `<div class="detail-placeholder">No label photo — tap Edit to add one</div>`}
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem;gap:12px">
      <div>
        <div style="font-size:19px;font-weight:500;color:var(--text)">${item.name}</div>
        <div style="font-size:13px;color:${locColor(item.loc)};font-weight:500;margin-top:3px">${item.loc}</div>
      </div>
      <button class="btn-amber" style="padding:7px 14px;font-size:13px;flex-shrink:0" onclick="closeModal('detail-modal');openEdit(${item.id})">Edit</button>
    </div>
    <div class="detail-row"><span class="dl">Category</span><span class="dv">${item.cat}</span></div>
    <div class="detail-row"><span class="dl">Quantity</span><span class="dv">${item.qty} bottle${item.qty!==1?'s':''}</span></div>
    <div class="detail-row"><span class="dl">Fill level</span><span class="dv"><span style="display:inline-flex;gap:2px">${dots}</span><span style="color:${f.color}">${f.label}</span></span></div>
    ${item.notes ? `<div class="detail-row"><span class="dl">Notes</span><span class="dv">${item.notes}</span></div>` : ''}
  `;
  openModal('detail-modal');
}

function openEdit(id) {
  editingId = id;
  const item = store.inventory.find(x => x.id === id);
  document.getElementById('e-name').value = item.name;
  document.getElementById('e-qty').value = item.qty;
  document.getElementById('e-notes').value = item.notes || '';
  populateSelect('e-loc', item.loc);
  document.getElementById('e-cat').value = item.cat;
  document.querySelectorAll('#e-fill-picker .fill-opt').forEach(b => b.classList.toggle('selected', b.dataset.fill === item.fill));
  editPhotoData = item.photo || null;
  setPhotoPreview('e', editPhotoData);
  openModal('edit-modal');
}

function saveEdit() {
  const item = store.inventory.find(x => x.id === editingId);
  if (!item) return;
  item.name = document.getElementById('e-name').value.trim() || item.name;
  item.loc = document.getElementById('e-loc').value;
  item.cat = document.getElementById('e-cat').value;
  item.qty = parseInt(document.getElementById('e-qty').value) || 0;
  item.notes = document.getElementById('e-notes').value.trim();
  const sel = document.querySelector('#e-fill-picker .fill-opt.selected');
  if (sel) item.fill = sel.dataset.fill;
  item.photo = editPhotoData;
  save(); render(); closeModal('edit-modal');
}

function deleteBottle() {
  if (!confirm('Remove this bottle?')) return;
  store.inventory = store.inventory.filter(x => x.id !== editingId);
  save(); render(); closeModal('edit-modal');
}

function openAdd() {
  addPhotoData = null;
  setPhotoPreview('a', null);
  document.getElementById('a-name').value = '';
  document.getElementById('a-qty').value = 1;
  document.getElementById('a-notes').value = '';
  populateSelect('a-loc', activeTab !== 'All' ? activeTab : store.locations[0]);
  document.querySelectorAll('#a-fill-picker .fill-opt').forEach(b => b.classList.toggle('selected', b.dataset.fill === 'full'));
  openModal('add-modal');
  setTimeout(() => document.getElementById('a-name').focus(), 80);
}

function addBottle() {
  const name = document.getElementById('a-name').value.trim();
  if (!name) { document.getElementById('a-name').focus(); return; }
  const sel = document.querySelector('#a-fill-picker .fill-opt.selected');
  store.inventory.push({
    id: nextId++, name,
    loc: document.getElementById('a-loc').value,
    cat: document.getElementById('a-cat').value,
    qty: parseInt(document.getElementById('a-qty').value) || 1,
    fill: sel ? sel.dataset.fill : 'full',
    notes: document.getElementById('a-notes').value.trim(),
    photo: addPhotoData
  });
  save(); render(); closeModal('add-modal');
}

function populateSelect(elId, selected) {
  document.getElementById(elId).innerHTML = store.locations.map(l => `<option value="${l}"${l===selected?' selected':''}>${l}</option>`).join('');
}

function openManageLocations() {
  renderLocChips();
  document.getElementById('new-loc-input').value = '';
  openModal('locs-modal');
}

function renderLocChips() {
  document.getElementById('loc-chips').innerHTML = store.locations.map(loc => {
    const col = locColor(loc);
    const isBuiltin = BUILTIN_LOCS.includes(loc);
    const hasBottles = store.inventory.some(i => i.loc === loc);
    const canDelete = !isBuiltin && !hasBottles;
    return `<span class="loc-chip" style="background:${col}18;color:${col};border-color:${col}40">
      ${loc}${canDelete ? `<span class="loc-chip-x" onclick="deleteLoc('${loc}')">×</span>` : ''}
    </span>`;
  }).join('');
}

function addLocation() {
  const name = document.getElementById('new-loc-input').value.trim();
  if (!name || store.locations.includes(name)) return;
  store.locations.push(name);
  save(); render(); renderLocChips();
  document.getElementById('new-loc-input').value = '';
}

function deleteLoc(loc) {
  if (store.inventory.some(i => i.loc === loc)) { alert('Move or delete all bottles in this location first.'); return; }
  store.locations = store.locations.filter(l => l !== loc);
  if (activeTab === loc) activeTab = 'All';
  save(); render(); renderLocChips();
}

function openFillOnly(id) {
  fillEditId = id;
  const item = store.inventory.find(x => x.id === id);
  document.getElementById('fill-modal-title').textContent = item.name;
  document.querySelectorAll('#fill-picker-main .fill-opt').forEach(b => b.classList.toggle('selected', b.dataset.fill === item.fill));
  openModal('fill-modal');
}

function saveFillOnly() {
  const sel = document.querySelector('#fill-picker-main .fill-opt.selected');
  if (sel && fillEditId) {
    const item = store.inventory.find(x => x.id === fillEditId);
    if (item) { item.fill = sel.dataset.fill; save(); render(); }
  }
  closeModal('fill-modal');
}

function pickFill(btn, pickerId) {
  document.querySelectorAll('#' + pickerId + ' .fill-opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function setPhotoPreview(prefix, data) {
  const prev = document.getElementById(prefix + '-photo-preview');
  const hint = document.getElementById(prefix + '-photo-hint');
  if (data) { prev.innerHTML = `<img src="${data}" style="width:100%;max-height:160px;object-fit:contain;border-radius:6px">`; hint.textContent = 'Tap to change'; }
  else { prev.innerHTML = ''; hint.textContent = 'Tap to add a photo'; }
}

function aPhotoTap() { document.getElementById('a-file-input').click(); }
function aPhotoCamera() { event.stopPropagation(); document.getElementById('a-camera-input').click(); }
function aPhotoFile() { event.stopPropagation(); document.getElementById('a-file-input').click(); }
function aClearPhoto() { addPhotoData = null; setPhotoPreview('a', null); }
function aHandleFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = ev => { addPhotoData = ev.target.result; setPhotoPreview('a', addPhotoData); }; r.readAsDataURL(f);
}

function ePhotoTap() { document.getElementById('e-file-input').click(); }
function ePhotoCamera() { event.stopPropagation(); document.getElementById('e-camera-input').click(); }
function ePhotoFile() { event.stopPropagation(); document.getElementById('e-file-input').click(); }
function eClearPhoto() { editPhotoData = null; setPhotoPreview('e', null); }
function eHandleFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = ev => { editPhotoData = ev.target.result; setPhotoPreview('e', editPhotoData); }; r.readAsDataURL(f);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function bgClick(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

async function openCocktails() {
  const inStock = store.inventory.filter(i => i.qty > 0).map(i => i.name);
  if (inStock.length < 2) { alert('Add at least 2 bottles to get cocktail suggestions.'); return; }
  document.getElementById('cocktail-result').innerHTML = '<div class="dot-pulse"><span></span><span></span><span></span></div>';
  openModal('cocktail-modal');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: `My home bar has: ${inStock.join(', ')}.\n\nSuggest 5 cocktails I can make. For each give the name, key ingredients from my list, and a 1-sentence method. Only suggest drinks where I have the core spirits. Format each with the cocktail name on its own line.` }]
      })
    });
    const data = await res.json();
    const text = data.content?.filter(b => b.type === 'text').map(b => b.text).join('') || 'No suggestions returned.';
    document.getElementById('cocktail-result').textContent = text;
  } catch(e) {
    document.getElementById('cocktail-result').textContent = 'Could not reach the AI service. Check your connection and try again.';
  }
}

render();
</script>
</body>
</html>
